<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ürün Yönetim Paneli</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    ÜRÜN YÖNETİM PANELİ — STATİK referans (JS YOK).
    Angular'da yapılacaklar:
      • Liste  -> ProductService içinde httpResource<ProductsResponse>('.../products')
      • Ekle   -> http.post('.../products/add', { title, price, stock }) + reload()
      • Sil    -> http.delete('.../products/{id}') + reload()
      • Arama  -> gelen listeyi computed ile YEREL süz (Modül 5)
      • Fiyat  -> {{ p.price | currency:'USD' }}   (Modül 6)
      • Stok   -> <span [appStockLevel]="p.stock">  custom DIRECTIVE (Modül 6)
                  0 -> kırmızı, <20 -> turuncu, diğer -> yeşil

    Aşağıda "sonuç" durumu görünür; yükleniyor/hata blokları yorumda.
  -->
  <main class="page">
    <div class="card">

      <header class="head">
        <h1>Ürün Yönetimi</h1>
        <p class="subtitle">DummyJSON API · listele, ekle, sil</p>
      </header>

      <!-- ===== EKLEME FORMU ===== -->
      <div class="form-row">
        <input class="f-input f-title" type="text" placeholder="Ürün adı" value="" />
        <input class="f-input f-price" type="text" placeholder="Fiyat" value="" />
        <input class="f-input f-stock" type="text" placeholder="Stok" value="" />
        <button class="add-btn">Ekle</button>
      </div>

      <!-- ===== ARAMA ===== -->
      <div class="search-row">
        <input class="search-input" type="text" placeholder="Ürünlerde ara..." value="" />
      </div>
      <p class="result-meta">30 üründen 4 tanesi</p>

      <!-- ===== SONUÇ DURUMU: @if (isLoading) ... @else if (error) ... @else ===== -->
      <ul class="admin-list">

        <!-- @for (product of filtered(); track product.id) { ...bu <li>... } -->
        <li class="admin-row">
          <span class="a-name">Essence Mascara Lash Princess</span>
          <span class="a-price">$9.99</span>
          <span class="stock stock-ok">99 adet</span>
          <button class="del-btn" aria-label="Sil">&times;</button>
        </li>
        <li class="admin-row">
          <span class="a-name">Eyeshadow Palette with Mirror</span>
          <span class="a-price">$19.99</span>
          <span class="stock stock-low">14 adet</span>
          <button class="del-btn" aria-label="Sil">&times;</button>
        </li>
        <li class="admin-row">
          <span class="a-name">Powder Canister</span>
          <span class="a-price">$14.99</span>
          <span class="stock stock-out">Tükendi</span>
          <button class="del-btn" aria-label="Sil">&times;</button>
        </li>
        <li class="admin-row">
          <span class="a-name">Red Lipstick</span>
          <span class="a-price">$12.99</span>
          <span class="stock stock-ok">68 adet</span>
          <button class="del-btn" aria-label="Sil">&times;</button>
        </li>

      </ul>

      <!-- ===== YÜKLENİYOR: @if (productService.isLoading()) =====
      <div class="skeleton">
        <div class="skel-row"></div>
        <div class="skel-row"></div>
        <div class="skel-row"></div>
      </div>
      -->

      <!-- ===== HATA: @else if (productService.error()) =====
      <div class="state-box">
        <span>Ürünler yüklenemedi.</span>
        <button class="add-btn">Tekrar dene</button>
      </div>
      -->

      <!-- ===== BOŞ: @empty =====
      <div class="state-box"><span>Aramana uyan ürün yok.</span></div>
      -->

    </div>
  </main>
</body>
</html>
