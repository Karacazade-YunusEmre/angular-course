<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sepet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    SEPET — STATİK referans (JS YOK).
    İki bölüm aynı CartService singleton'ına bağlanacak:
      • ProductList  -> her üründe "Sepete Ekle" -> cart.add(product)
      • CartSummary  -> cart.items() / cart.count() / cart.total()
    Bir yerde ekleyince diğeri anında güncellenir (DI + signal).

    Eşleştirme:
      • Ürün fiyatı  -> {{ p.price | currency:'TRY' }}
      • "Sepete Ekle" -> (click)="cart.add(p)"
      • Sepet başlığı -> Sepet ({{ cart.count() }})
      • Toplam        -> {{ cart.total() | currency:'TRY' }}
      • Çıkar (×)     -> (click)="cart.remove(item.id)"
  -->
  <main class="page">

    <!-- ===== ProductList ===== -->
    <div class="card">
      <header class="head">
        <h1>Mağaza</h1>
        <p class="subtitle">Bir ürünü sepete ekle</p>
      </header>
      <ul class="product-list">
        <li class="product-row">
          <span class="p-name">Kablosuz Kulaklık</span>
          <span class="p-price">₺1,299.00</span>
          <button class="add-btn">Sepete Ekle</button>
        </li>
        <li class="product-row">
          <span class="p-name">Mekanik Klavye</span>
          <span class="p-price">₺2,450.00</span>
          <button class="add-btn">Sepete Ekle</button>
        </li>
        <li class="product-row">
          <span class="p-name">USB-C Kablo</span>
          <span class="p-price">₺149.00</span>
          <button class="add-btn">Sepete Ekle</button>
        </li>
      </ul>
    </div>

    <!-- ===== CartSummary ===== -->
    <div class="card cart">
      <header class="head cart-head">
        <h1>Sepet (2)</h1>
        <button class="clear-btn">Temizle</button>
      </header>

      <ul class="cart-list">
        <li class="cart-row">
          <span class="c-name">Kablosuz Kulaklık</span>
          <span class="c-price">₺1,299.00</span>
          <button class="remove-btn" aria-label="Çıkar">&times;</button>
        </li>
        <li class="cart-row">
          <span class="c-name">USB-C Kablo</span>
          <span class="c-price">₺149.00</span>
          <button class="remove-btn" aria-label="Çıkar">&times;</button>
        </li>
      </ul>

      <div class="cart-total">
        <span>Toplam</span>
        <span class="total-value">₺1,448.00</span>
      </div>
    </div>

  </main>
</body>
</html>
