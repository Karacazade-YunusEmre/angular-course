<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ürün Yönetim Paneli</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    ÜRÜN YÖNETİM PANELİ — STATİK referans (JS YOK)
    Backend: ProductsApi (.NET 10)  ·  http://localhost:5080

    ANGULAR KARŞILIKLARI
    ────────────────────────────────────────────────────────────────
    Servis (Modül 7 + 8):
      private readonly response = httpResource<PagedResult<Product>>(
        () => `${BASE}/api/products?${this.queryString()}`
      );
      readonly products = computed(() => this.response.value()?.items ?? []);
      readonly total    = computed(() => this.response.value()?.total ?? 0);

    Filtre alanları birer signal olur; queryString() bir computed'dir:
      name, minPrice, maxPrice, minStock, maxStock, sort, page, pageSize
      → filtre değişince URL değişir → httpResource İSTEĞİ OTOMATİK YENİLER.
      (Bu yüzden burada arama YEREL değil, SUNUCU tarafında yapılır.)

    Ekle  -> http.post(`${BASE}/api/products`, body).subscribe(() => reload())
    Sil   -> http.delete(`${BASE}/api/products/${id}`).subscribe(() => reload())

    Test kolaylıkları:
      ?delay=1500                      → yükleniyor ekranını görmek için
      GET /api/products/error-demo     → hata ekranını görmek için
  -->
  <main class="page">
    <div class="card">

      <header class="head">
        <h1>Ürün Yönetimi</h1>
        <p class="subtitle">ProductsApi · listele, ara, sayfala, ekle, sil</p>
      </header>

      <!-- ===================================================================
           EKLEME FORMU
           (click)="add()" → POST /api/products, sonra reload()
      ==================================================================== -->
      <section class="form-row">
        <input class="f-input f-name"  type="text" placeholder="Ürün adı" value="" />
        <input class="f-input f-cat"   type="text" placeholder="Kategori" value="" />
        <input class="f-input f-num"   type="text" placeholder="Fiyat" value="" />
        <input class="f-input f-num"   type="text" placeholder="Stok" value="" />
        <button class="btn btn-primary">Ekle</button>
      </section>

      <!-- ===================================================================
           ARAMA / FİLTRE PANELİ
           Her alan bir signal; değişince sunucuya yeni istek gider.
           name → ?name=   |  fiyat → ?minPrice=&maxPrice=
           stok → ?minStock=&maxStock=  |  sıralama → ?sort=
      ==================================================================== -->
      <section class="filters">

        <div class="filter-group grow">
          <label class="f-label">Ürün adı</label>
          <input class="f-input" type="text" placeholder="ada göre ara..." value="kahve" />
        </div>

        <div class="filter-group">
          <label class="f-label">Fiyat aralığı</label>
          <div class="range">
            <input class="f-input f-num" type="text" placeholder="min" value="500" />
            <span class="dash">–</span>
            <input class="f-input f-num" type="text" placeholder="max" value="3000" />
          </div>
        </div>

        <div class="filter-group">
          <label class="f-label">Stok aralığı</label>
          <div class="range">
            <input class="f-input f-num" type="text" placeholder="min" value="" />
            <span class="dash">–</span>
            <input class="f-input f-num" type="text" placeholder="max" value="" />
          </div>
        </div>

        <div class="filter-group">
          <label class="f-label">Sıralama</label>
          <select class="f-select">
            <option>Varsayılan</option>
            <option>Ada göre (A→Z)</option>
            <option selected>Fiyat (artan)</option>
            <option>Fiyat (azalan)</option>
            <option>Stok (artan)</option>
          </select>
        </div>

        <button class="btn btn-ghost">Temizle</button>
      </section>





      

    </div>
  </main>
</body>
</html>
